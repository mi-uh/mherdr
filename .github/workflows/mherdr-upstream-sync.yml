name: mherdr upstream sync

# Weekly: merge new herdrdev/herdr commits into a `upstream-sync` branch of this
# fork and open a pull request, or an issue when the merge conflicts.
# Upstream is only fetched (read-only); nothing is ever pushed there.

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mherdr-upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM_URL: https://github.com/herdrdev/herdr.git
  SYNC_BRANCH: upstream-sync
  CONFLICT_TITLE: "upstream sync: merge conflict"

jobs:
  sync:
    if: github.repository == 'mi-uh/mherdr'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: master
          fetch-depth: 0

      - name: Fetch upstream (read-only)
        run: |
          git remote add upstream "$UPSTREAM_URL"
          git remote set-url --push upstream DISABLED
          git fetch --no-tags upstream master
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Check for new upstream commits
        id: check
        run: |
          count=$(git rev-list --count HEAD..upstream/master)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "upstream=$(git rev-parse --short upstream/master)" >> "$GITHUB_OUTPUT"
          echo "$count new upstream commit(s)"

      - name: Merge upstream
        id: merge
        if: steps.check.outputs.count != '0'
        env:
          UPSTREAM_SHORT: ${{ steps.check.outputs.upstream }}
        run: |
          git checkout -B "$SYNC_BRANCH"
          if git merge --no-ff upstream/master -m "chore: merge upstream herdr $UPSTREAM_SHORT"; then
            echo "conflict=false" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only --diff-filter=U > "$RUNNER_TEMP/conflicts.txt"
            git merge --abort
            echo "conflict=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Report conflict
        if: steps.merge.outputs.conflict == 'true'
        env:
          UPSTREAM_SHORT: ${{ steps.check.outputs.upstream }}
          COUNT: ${{ steps.check.outputs.count }}
        run: |
          {
            echo "Merging upstream \`$UPSTREAM_SHORT\` ($COUNT new commits) into \`master\` conflicts in:"
            echo
            sed 's/^/- `/; s/$/`/' "$RUNNER_TEMP/conflicts.txt"
            echo
            echo "Resolve locally:"
            echo
            echo '```bash'
            echo 'git fetch upstream && git checkout master && git merge upstream/master'
            echo '# fix the conflicts, git add, git commit, run the tests'
            echo 'git push origin master'
            echo '```'
            echo
            echo "Run: $GITHUB_SERVER_URL/$REPO/actions/runs/$GITHUB_RUN_ID"
          } > "$RUNNER_TEMP/issue.md"
          existing=$(gh issue list --repo "$REPO" --state open --search "\"$CONFLICT_TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body-file "$RUNNER_TEMP/issue.md"
          else
            gh issue create --repo "$REPO" --title "$CONFLICT_TITLE" --body-file "$RUNNER_TEMP/issue.md"
          fi
          # Fail the run so the conflict also shows up as a failed workflow.
          exit 1

      - name: Open or update pull request
        if: steps.merge.outputs.conflict == 'false'
        env:
          UPSTREAM_SHORT: ${{ steps.check.outputs.upstream }}
          COUNT: ${{ steps.check.outputs.count }}
        run: |
          git push --force origin "$SYNC_BRANCH"
          {
            echo "Merges upstream herdr \`$UPSTREAM_SHORT\` ($COUNT new commits) into mherdr."
            echo
            echo "**Do not squash or rebase this pull request.** It must keep upstream's"
            echo "history as an ancestor, or every later sync conflicts. Take it as a"
            echo "fast-forward instead:"
            echo
            echo '```bash'
            echo "git fetch origin && git checkout master && git merge --ff-only origin/$SYNC_BRANCH"
            echo "git push origin master   # GitHub then marks this pull request as merged"
            echo '```'
            echo
            echo "CI does not start for pull requests opened by Actions. Close and reopen"
            echo "this pull request once to run it, or rely on the CI run after the push."
            echo
            echo "Upstream changes: https://github.com/herdrdev/herdr/compare/$(git merge-base HEAD~1 upstream/master)...$UPSTREAM_SHORT"
          } > "$RUNNER_TEMP/pr.md"
          pr=$(gh pr list --repo "$REPO" --head "$SYNC_BRANCH" --state open --json number --jq '.[0].number // empty')
          if [ -n "$pr" ]; then
            gh pr edit "$pr" --repo "$REPO" --body-file "$RUNNER_TEMP/pr.md"
          else
            gh pr create --repo "$REPO" --base master --head "$SYNC_BRANCH" \
              --title "chore: merge upstream herdr" --body-file "$RUNNER_TEMP/pr.md"
          fi
